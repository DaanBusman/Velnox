# Velnox — production compose stack.
#
# Six services plus a one-shot migration job. Run it from the repository root:
#
#     ./scripts/gen-env.sh          # generates .env with strong secrets
#     pnpm docker:up
#
# Networks are split so the data tier has no route to the outside world and no
# published ports: only Caddy is reachable from the host, and only the worker
# opens connections to managed infrastructure (docs/service-diagram.md).

name: velnox

x-build-args: &build-args
  VELNOX_VERSION: ${VELNOX_VERSION:-0.2.4}
  VELNOX_BUILD_COMMIT: ${VELNOX_BUILD_COMMIT:-unknown}
  VELNOX_BUILD_TIME: ${VELNOX_BUILD_TIME:-}

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-velnox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-velnox}?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
  VELNOX_VERSION: ${VELNOX_VERSION:-0.2.4}
  VELNOX_BUILD_COMMIT: ${VELNOX_BUILD_COMMIT:-unknown}
  VELNOX_SOURCE_URL: ${VELNOX_SOURCE_URL:-https://github.com/DaanBusman/Velnox}
  VELNOX_DEFAULT_LOCALE: ${VELNOX_DEFAULT_LOCALE:-en}
  VELNOX_DEFAULT_TIMEZONE: ${VELNOX_DEFAULT_TIMEZONE:-Europe/Amsterdam}

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velnox}
      POSTGRES_USER: ${POSTGRES_USER:-velnox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run ./scripts/gen-env.sh}
      # Deterministic collation, so index ordering does not change under the
      # database when the base image's locale data is updated.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-velnox} -d ${POSTGRES_DB:-velnox}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required — run ./scripts/gen-env.sh}
      - --appendonly
      - 'yes'
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Migrations run once, to completion, before the API starts. Never on API boot:
  # with more than one replica that is a race, and a failed migration must stop
  # the deployment rather than crash-loop a serving container.
  migrate:
    # Reuses the image built by `api` — same Dockerfile, same content. Building it
    # three times in parallel only wasted CPU and disk.
    image: velnox-backend:local
    restart: 'no'
    environment: *backend-env
    command: ['pnpm', '--filter', '@velnox/db', 'run', 'migrate:deploy']
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    # The single build of the backend image; worker and migrate reference the tag.
    image: velnox-backend:local
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      args: *build-args
    restart: unless-stopped
    environment:
      <<: *backend-env
      API_PORT: 4000
      APP_URL: ${APP_URL:-https://localhost}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run ./scripts/gen-env.sh}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
    command: ['node', 'apps/api/dist/main.js']
    networks: [app, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The only service that performs outbound automation. No published port and no
  # listening socket: nothing on the network can reach it.
  worker:
    image: velnox-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    command: ['node', 'apps/worker/dist/main.js']
    # `data` reaches PostgreSQL and Redis; `egress` is what lets the worker reach
    # Proxmox, vCenter and Hyper-V from Phase 4 onward. It is the only service
    # that needs both.
    networks: [data, egress]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/health/heartbeat-check.js']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: velnox-web:local
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args: *build-args
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_INTERNAL_URL: http://api:4000
      VELNOX_DEFAULT_LOCALE: ${VELNOX_DEFAULT_LOCALE:-en}
      VELNOX_DEFAULT_TIMEZONE: ${VELNOX_DEFAULT_TIMEZONE:-Europe/Amsterdam}
    networks: [app]
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      VELNOX_SITE_ADDRESS: ${VELNOX_SITE_ADDRESS:-localhost}
      VELNOX_TLS: ${VELNOX_TLS:-internal}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [app]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:2020/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Reachable from the host through Caddy only. Carries the API's outbound path
  # to the OIDC provider during a login flow — its one external dependency.
  app:
    driver: bridge

  # Internal: PostgreSQL and Redis have no published ports and no route off the
  # host at all, so a compromised dependency cannot phone home from the data tier.
  data:
    driver: bridge
    internal: true

  # Outbound path to managed customer infrastructure. Only the worker joins it,
  # which is the network-level expression of ADR-009: the API has no route to a
  # managed node even if a code path were introduced by mistake.
  egress:
    driver: bridge

volumes:
  pgdata:
    name: velnox_pgdata
  redisdata:
    name: velnox_redisdata
  caddydata:
    name: velnox_caddydata
  caddyconfig:
    name: velnox_caddyconfig
