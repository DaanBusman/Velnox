packages:
  - 'apps/*'
  - 'packages/*'

# Which dependencies may run install scripts.
#
# A postinstall script is arbitrary code from the registry running on a build
# machine, so the default is no. Twelve packages ask; six get it.
#
# pnpm fails the install rather than warning when a package that wants a build
# script is not listed either way, so this allowlist cannot quietly stop
# applying — which is exactly what it did before. Under pnpm 10 the setting was
# `pnpm.onlyBuiltDependencies` in package.json, a list, and the two denials
# below were simply absent from it and silently ignored. pnpm 12 ignores that
# key entirely and blocks every build, so the migration announces itself.
#
# One trap worth recording: `pnpm config get onlyBuiltDependencies` still echoed
# the old value back after the upgrade, because it reads the settings map
# without validating the key. It is not evidence that a setting is in effect.
#
# Denied, and why:
#
#   @scarf/scarf      install-time telemetry, pulled in by swagger-ui-dist. It
#                     reports installations to a third party from the build
#                     machine. On a self-hosted product for management networks
#                     that is the wrong default twice over.
#   msgpackr-extract  an optional native accelerator for msgpackr, which arrives
#                     under BullMQ. It ships prebuilt binaries for every platform
#                     as optional dependencies and msgpackr falls back to its
#                     JavaScript path without it, so the build script buys a
#                     compiler on the build host and nothing else.
#   @parcel/watcher   and
#   @swc/core         both arrive under next-intl 4, for its message extractor,
#                     which Velnox does not use. Both ship prebuilt binaries as
#                     optional dependencies. The watcher's script does nothing
#                     unless asked to compile from source; swc's checks its
#                     binary and, if that fails, installs a WebAssembly fallback
#                     from the registry — a second, unpinned download at install
#                     time. Neither is needed with the binaries present.
#   ssh2              and
#   cpu-features      arrive with Phase 5A's SSH copy. ssh2's script runs
#                     node-gyp to build an optional native crypto binding and
#                     treats failure as success; without it ssh2 uses its
#                     JavaScript implementation. cpu-features is an optional
#                     native helper ssh2 uses to pick a cipher order. Both would
#                     put a compiler on the build host for a speed-up on a copy
#                     that is bounded by the network anyway.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': false
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  ssh2: false
  unrs-resolver: true

# Security fixes for versions a dependency pins exactly, each inside the major
# that dependency asks for — unless the entry says why not — so nothing it
# relies on changes shape. Remove an entry once the dependency itself requires
# the fixed version.
#
#   js-yaml  Not a security fix any more but a licence hold. @nestjs/swagger 12
#            pins 5.5.0, which moves to argparse 3, under PSF-2.0, a licence
#            scripts/check-licenses.mjs does not yet allow; allowing it is the
#            owner's decision. 5.4.x keeps the merge-key CPU fix
#            (GHSA-r3ph-w7gj-g6xm) and the API swagger uses. Swagger only
#            writes its own YAML.
#   effect   @prisma/config 6.19.3 pins 3.21.0; 3.22.1 fixes a ReDoS in
#            Schema.TemplateLiteral. Prisma reads only its own configuration
#            with it.
#   deepmerge-ts
#            @prisma/config 6.19.3 pins 7.1.5; the fix for stack exhaustion on
#            recursive objects exists only in 8. Across a major on purpose:
#            Prisma calls plain deepmerge(), and 8 changes only deepmergeInto
#            aliasing and type names. Proven by prisma generate in CI and
#            migrate deploy in the stack. Prisma merges only its own
#            configuration with it.
overrides:
  js-yaml: ~5.4.1
  effect: ^3.22.5
  deepmerge-ts: ^8.0.2
